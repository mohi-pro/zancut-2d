<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zancut Admin</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1b1b1f;--mut:#6b6b76;--line:#e4e2dc;--acc:#ff6a2b;--ok:#1f9d55;--bad:#d33;--warn:#b07800}
@media(prefers-color-scheme:dark){:root{--bg:#141417;--card:#1d1d22;--ink:#f1f0ee;--mut:#9a9aa6;--line:#2c2c33}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,"Hind Siliguri","Anek Bangla","Kohinoor Bangla",sans-serif}
header{display:flex;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header b{font-size:16px}header .sp{flex:1}
nav{display:flex;gap:4px;padding:8px 16px 0;flex-wrap:wrap}nav button{background:transparent;color:var(--mut);border:0;border-bottom:2px solid transparent;border-radius:0;padding:8px 12px;font-weight:600}nav button.on{color:var(--ink);border-color:var(--acc)}
main{max-width:1180px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
h2{font-size:15px;margin:0 0 4px}label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
input,select,textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
input[type=checkbox],input[type=file]{width:auto}textarea{min-height:110px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.row>*{flex:1;min-width:120px}.row>.fit{flex:0 0 auto;min-width:0}
button{background:var(--acc);color:#fff;border:0;border-radius:9px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}button.g{background:transparent;color:var(--ink);border:1px solid var(--line)}button.s{padding:4px 9px;font-size:12px}button:disabled{opacity:.45;cursor:default}
.mut{color:var(--mut);font-size:12px}.err{color:var(--bad)}.ok{color:var(--ok)}.warn{color:var(--warn)}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;border:1px solid var(--line);font-size:11px;margin:2px;white-space:nowrap}.tag.never{border-color:var(--bad);color:var(--bad)}.tag.always{border-color:var(--ok);color:var(--ok)}
.tbl{width:100%;border-collapse:collapse;font-size:12px}.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}.tbl select{padding:3px 4px;font-size:12px;min-width:92px}
.scroll{max-height:460px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}.metric{background:var(--bg);border-radius:10px;padding:10px}.metric b{display:block;font-size:20px}
.switch{position:relative;display:inline-block;width:40px;height:22px}.switch input{opacity:0;width:0;height:0}.switch span{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.15s}.switch span:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}.switch input:checked+span{background:var(--ok)}.switch input:checked+span:before{transform:translateX(18px)}
.sand{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px}@media(max-width:900px){.sand{grid-template-columns:1fr}}
.stage{position:relative;width:100%;background:#000;border-radius:10px;overflow:hidden}.stage iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0;pointer-events:none}
.player{display:flex;gap:8px;align-items:center;margin-top:8px}.player input[type=range]{flex:1}
.rc{border-left:3px solid var(--line);padding:6px 10px;margin:8px 0;background:var(--bg);border-radius:6px}.rc.fired{border-color:var(--ok)}
.fix{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px;margin-top:6px}
.hide{display:none}
</style></head>
<body>
<header><b>Zancut Admin</b><span class="mut">Training &amp; control studio — the owner only</span><span class="sp"></span><a class="mut" href="/">Customer app →</a><button class="g s hide" id="out">Sign out</button></header>
<nav id="tabs"></nav>
<main id="main"></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
let T=null,tab='feed',H=null; // owner session (page memory only), heads
const api=async(u,{method,body,raw,headers}={})=>{const r=await fetch(u,{method:method||(body||raw?'POST':'GET'),headers:{...(raw?{}:{'content-type':'application/json'}),...(T?{authorization:'Bearer '+T}:{}),...(headers||{})},body:raw||(body?JSON.stringify(body):undefined)});const j=await r.json().catch(()=>({}));if(r.status===401){T=null;draw();throw new Error('Sign in again.')}if(!r.ok)throw new Error(j.error||r.statusText);return j};
const TABS=[['feed','📥 Feeder'],['video','🎥 Reference video'],['rules','🚫 Rules'],['sandbox','🧪 Sandbox'],['users','🔐 Users & vault']];
function drawTabs(){$('#tabs').innerHTML=T?TABS.map(([k,t])=>`<button data-k="${k}" class="${tab===k?'on':''}">${t}</button>`).join(''):'';document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.k;draw()});$('#out').classList.toggle('hide',!T)}
$('#out').onclick=()=>{T=null;draw()};
async function draw(){drawTabs();if(!T)return login();if(!H)H=await api('/api/admin/heads');({feed,video,rules,sandbox,users})[tab]()}
function login(){$('#main').innerHTML=`<div class="card" style="max-width:460px;margin:40px auto"><h2>Owner sign-in</h2><p class="mut">The admin studio trains the brain that every customer film uses. Set the owner password once in the terminal: <code>npm run hub-owner -- set-password "…"</code></p><div class="row"><input id="pw" type="password" placeholder="Owner password" autocomplete="current-password"><button class="fit" id="go">Sign in</button></div><div id="lm" class="mut"></div></div>`;
 $('#go').onclick=async()=>{try{T=(await api('/api/hub/owner/login',{body:{password:$('#pw').value}})).token;draw()}catch(e){$('#lm').innerHTML=`<span class="err">${esc(e.message)}</span>`}};$('#pw').onkeydown=e=>{if(e.key==='Enter')$('#go').click()}}

/* ---------- shared: an editable label table ---------- */
const HEADS=['place','action','face','broll','graphic','cameraMove'];
function labelTable(rows,id){const opts=(h,v)=>H.heads[h].map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');
 return `<div class="scroll"><table class="tbl" id="${id}"><tr><th>#</th><th>sentence</th>${HEADS.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.slice(0,400).map((r,i)=>`<tr${r.test?' style="opacity:.5"':''}><td>${i+1}</td><td>${esc(r.text)}${r.test?' <span class="tag never">test sentence: never fed</span>':''}</td>${HEADS.map(h=>`<td><select data-r="${i}" data-h="${h}">${opts(h,r.labels[h])}</select>${r.conf?`<div class="mut">${r.given?.includes(h)?'given':Math.round(r.conf[h]*100)+'%'}</div>`:''}</td>`).join('')}</tr>`).join('')}</table></div>${rows.length>400?`<div class="mut">Showing 400 of ${rows.length}; all are fed.</div>`:''}`}
const readTable=(rows,id)=>{document.querySelectorAll(`#${id} select`).forEach(s=>{rows[+s.dataset.r].labels[s.dataset.h]=s.value});return rows.filter(r=>!r.test).map(r=>({text:r.text,ctx:r.ctx,...r.labels}))};

/* ---------- 1. multi-source feeder ---------- */
let feedRows=[],teachRows=[];
function feed(){$('#main').innerHTML=`<div class="card"><h2>Bulk story &amp; script feeder</h2><div class="mut">Paste 1–1,000 Bangla or English sentences (or a whole story), or open a .txt / .jsonl file (rows like {"text": "…", "place": "market_bazaar"}). Preview shows what the brain reads; change any label, then feed.</div>
 <textarea id="bulk" placeholder="রাফি বাজারে গেল। চালের দাম ৪০ টাকা থেকে বেড়ে ৬৫ টাকা হয়েছে। …"></textarea><div class="row" style="margin-top:6px"><input type="file" id="bf" accept=".txt,.jsonl,.json,text/plain" class="fit"><span></span><label class="fit" style="display:flex;gap:4px;align-items:center;margin:0" title="Unknown words are looked up on Wikipedia / Wikidata (facts and open-licence pictures; never a model)"><input type="checkbox" id="bw" checked> learn unknown words from the web</label><button class="g fit" id="bp">Preview what the brain extracts</button><button class="fit" id="bfd" ${feedRows.length?'':'disabled'}>Feed into Brain</button></div><div id="bm" class="mut"></div><div id="bt">${feedRows.length?labelTable(feedRows,'ft'):''}</div></div>
 <div class="card"><h2>Web topic feeder</h2><div class="mut">Topics, comma-separated (বাংলাদেশের গ্রাম, কৃষি, শেয়ার বাজার, ক্রিকেট). Facts and open-licence icons from Wikipedia / Wikidata go into learned knowledge — no model reads them.</div><div class="row" style="margin-top:6px"><input id="tp" placeholder="কৃষি, শেয়ার বাজার, ক্রিকেট"><label class="fit" style="display:flex;gap:4px;align-items:center;margin:0"><input type="checkbox" id="tw" checked> use the web</label><button class="fit" id="tg">Learn topics</button></div><div id="tm"></div></div>
 <div class="card"><h2>Teacher: generate training examples</h2><div class="mut">Offline template expansion: one topic → labelled sentences in Bangla and English, using the place registry, the b-roll kit and the brain's own reading. <b>No model is used</b> — a Gemini teacher is not built because CLAUDE.md forbids model APIs.</div><div class="row" style="margin-top:6px"><input id="tt" placeholder="শেয়ার বাজার"><input id="tn" type="number" min="10" max="300" value="100" class="fit" style="width:90px"><button class="fit" id="tgen">Generate 100 Training Examples</button><button class="fit" id="tfd" ${teachRows.length?'':'disabled'}>Feed into Brain</button></div><div id="gm" class="mut"></div><div id="gt">${teachRows.length?labelTable(teachRows,'gtb'):''}</div></div>
 <div class="card"><h2>Teach a rule / create a character</h2><div class="mut">“যখনই দাম বাড়ার কথা থাকবে তখন চার্ট দেখাবা” · “তিন মাথার নীল রাক্ষস বানাও” · “শেখো ইলিশ”</div><div class="row" style="margin-top:6px"><input id="cmd" placeholder="Type an instruction"><button class="fit" id="cgo">Run</button></div><div id="cm" class="mut"></div></div>`;
 $('#bf').onchange=async()=>{const f=$('#bf').files[0];if(f)$('#bulk').value=await f.text()};
 $('#bp').onclick=async()=>{$('#bm').textContent='Reading…';try{const pr=await api('/api/admin/feed/preview',{body:{text:$('#bulk').value,online:$('#bw').checked}});feedRows=pr.rows;$('#bt').innerHTML=labelTable(feedRows,'ft');$('#bfd').disabled=!feedRows.length;$('#bm').innerHTML=`${feedRows.length} sentences. ${feedRows.filter(r=>r.test).length} are test sentences and will be skipped. ${feedRows.filter(r=>r.scene?.place).length} have a place from the scene they describe.`+(pr.learned?.length?`<div class="rc fired"><b>Learned ${pr.learned.length} new words:</b> ${pr.learned.map(x=>`<span class="tag">${esc(x.term)} · ${esc(x.category||'?')}${x.piece?' · draws '+esc(x.piece):x.prop?' · picture '+esc(x.prop):''}${x.place?' · '+esc(x.place):''}</span>`).join('')}</div>`:'')}catch(e){$('#bm').innerHTML=`<span class="err">${esc(e.message)}</span>`}};
 $('#bfd').onclick=async()=>{const rows=readTable(feedRows,'ft');$('#bm').textContent='Feeding…';try{const r=await api('/api/admin/feed',{body:{rows}});$('#bm').innerHTML=`<span class="ok">Fed ${r.fed} sentences into the brain in ${r.ms} ms${r.retrained?' (a full retrain: new labels such as a new place)':''}.</span>${r.refused.length?` ${r.refused.length} refused (${esc(r.refused[0].why)}…).`:''}`;feedRows=[];$('#bt').innerHTML='';$('#bfd').disabled=true}catch(e){$('#bm').innerHTML=`<span class="err">${esc(e.message)}</span>`}};
 $('#tg').onclick=async()=>{$('#tm').innerHTML='<span class="mut">Looking up…</span>';try{const r=await api('/api/admin/feed-topic',{body:{topics:$('#tp').value,online:$('#tw').checked}});$('#tm').innerHTML=r.map(x=>`<div class="rc ${x.known?'fired':''}"><b>${esc(x.topic)}</b> ${x.error?`<span class="err">${esc(x.error)}</span>`:x.known?`<span class="tag">${esc(x.category)}</span>${x.english?`<span class="tag">${esc(x.english)}</span>`:''}${x.prop?`<span class="tag">prop ${esc(x.prop)}</span>`:''} <span class="mut">${esc(x.sources.join(' + '))}${x.synonyms.length?' · '+esc(x.synonyms.join(', ')):''}</span>`:'<span class="mut">not found</span>'}</div>`).join('')}catch(e){$('#tm').innerHTML=`<span class="err">${esc(e.message)}</span>`}};
 $('#tgen').onclick=async()=>{$('#gm').textContent='Generating…';try{const r=await api('/api/admin/teacher',{body:{topic:$('#tt').value,n:+$('#tn').value}});teachRows=r.rows;$('#gt').innerHTML=labelTable(teachRows,'gtb');$('#tfd').disabled=false;$('#gm').innerHTML=`${r.rows.length} examples for “${esc(r.topic)}”. ${esc(r.note)}`}catch(e){$('#gm').innerHTML=`<span class="err">${esc(e.message)}</span>`}};
 $('#tfd').onclick=async()=>{const rows=readTable(teachRows,'gtb');$('#gm').textContent='Feeding…';try{const r=await api('/api/admin/feed',{body:{rows}});$('#gm').innerHTML=`<span class="ok">Trained on ${r.fed} examples in ${r.ms} ms.</span>`;teachRows=[];$('#gt').innerHTML='';$('#tfd').disabled=true}catch(e){$('#gm').innerHTML=`<span class="err">${esc(e.message)}</span>`}};
 $('#cgo').onclick=async()=>{try{const r=await api('/api/command',{body:{text:$('#cmd').value}});$('#cm').innerHTML=esc(r.said)}catch(e){$('#cm').innerHTML=`<span class="err">${esc(e.message)}</span>`}}}

/* ---------- 2. reference video ---------- */
let vprof=null;
async function video(){const cur=await api('/api/admin/style').catch(()=>null);
 $('#main').innerHTML=`<div class="card"><h2>Learn style from a reference video</h2><div class="mut">Upload a cartoon or video (.mp4). ffmpeg measures its cut rhythm, motion and pauses. Apply it and new films cut at that pace.</div><div class="row" style="margin-top:8px"><input type="file" id="vf" accept="video/*" class="fit"><button class="fit" id="vu">Measure this video</button></div><div id="vm" class="mut"></div><div id="vp"></div></div>
 <div class="card"><h2>Applied now</h2>${cur?.applied?`<div>Shot length <b>${cur.applied.shotSeconds} s</b> from ${esc(cur.source||'a video')} · ${esc(cur.applied.at.slice(0,16).replace('T',' '))}</div>`:'<div class="mut">Default pacing (3.5 s per shot, from the reference study).</div>'}</div>`;
 $('#vu').onclick=async()=>{const f=$('#vf').files[0];if(!f)return;$('#vm').textContent=`Uploading and measuring ${f.name} (${(f.size/1048576).toFixed(1)} MB)…`;try{const r=await api('/api/admin/learn-from-video?name='+encodeURIComponent(f.name),{raw:f,headers:{'content-type':'application/octet-stream'}});vprof={...r.profile,name:r.original};showProfile()}catch(e){$('#vm').innerHTML=`<span class="err">${esc(e.message)}</span>`}}}
function showProfile(){const p=vprof,a=p.audio,m=(k,v,u='')=>`<div class="metric"><span class="mut">${k}</span><b>${v??'—'}${v==null?'':u}</b></div>`;
 $('#vm').textContent=`${p.name} · ${p.seconds} s`;$('#vp').innerHTML=`<div class="grid" style="margin-top:8px">${m('Average shot',p.avgShotSeconds,' s')}${m('Median shot',p.medianShotSeconds,' s')}${m('Cuts per minute',p.cutsPerMinute)}${m('Shots',p.shots)}${m('Motion intensity',p.motionIntensity,'/100')}${m('Movement runs / min',p.movementRunsPerMinute)}${m('Nearly still',p.nearlyStillShare,'%')}${a?m('Speech share',a.speechShare,'%')+m('Pauses / min',a.pausesPerMinute)+m('Average pause',a.avgPauseSeconds,' s')+m('Loudness',a.loudnessLUFS,' LUFS')+m('Loudness range',a.loudnessRangeLU,' LU'):''}</div>
 ${a?`<div class="mut" style="margin-top:6px">Ducking: ${esc(a.ducking)}.</div>`:''}<div class="mut">${esc(p.method)}</div><button style="margin-top:10px" id="va">Apply This Video's Pacing &amp; Style to Brain</button> <span id="vam"></span>`;
 $('#va').onclick=async()=>{try{const r=await api('/api/admin/style/apply',{body:{profile:p,source:p.name}});$('#vam').innerHTML=`<span class="ok">Applied: new films cut every ${r.applied.shotSeconds} s.</span>`}catch(e){$('#vam').innerHTML=`<span class="err">${esc(e.message)}</span>`}}}

/* ---------- 3. strict rules ---------- */
const whenText=w=>[w.talking?'while talking':'',w.places?.length?'place: '+w.places.join(', '):'',w.words?.length?'words: '+w.words.join(', '):'',w.numbers==='compare'?'numbers compared':w.numbers==='any'?'a number':''].filter(Boolean).join(' · ')||'always';
const thenText=r=>r.kind==='never'?`never ${r.head}: ${(r.values||[]).join(', ')}`:r.value?`${r.head} → ${r.value}`:`${r.head} never none`;
async function rules(){const rs=await api('/api/admin/rules');
 $('#main').innerHTML=`<div class="card"><h2>Add a rule</h2><div class="mut">Plain Bangla or English. “কথা বলার সময় কখনো হাত পা ছুঁড়বে না, শান্তভাবে কথা বলবে” · “When place is bedroom or classroom never use outdoor b-roll” · “যখন [টাকা, দাম, খরচ] থাকবে তখন graphic কখনো none ছাড়বে না” · “যখনই সংখ্যার তুলনা থাকবে তখন dynamic_comparison_chart দেখাবে”</div><div class="row" style="margin-top:6px"><input id="rt" placeholder="Write a Do or a Don't"><button class="g fit" id="rp">Check</button><button class="fit" id="ra">Add rule</button></div><div id="rm" class="mut"></div></div>
 <div class="card"><h2>Active rules</h2><div class="mut">They override the brain's guesses in every film (customer films too).</div><table class="tbl" style="margin-top:6px"><tr><th></th><th>rule</th><th>when</th><th>then</th><th>on</th><th></th></tr>${rs.map(r=>`<tr><td><span class="tag ${r.kind}">${r.kind==='never'?'Never':'Always'}</span></td><td>${esc(r.text)}</td><td class="mut">${esc(whenText(r.when||{}))}</td><td>${esc(thenText(r))}</td><td><label class="switch" title="Active / Disabled"><input type="checkbox" data-tg="${esc(r.id)}" ${r.active!==false?'checked':''}><span></span></label></td><td><button class="g s" data-del="${esc(r.id)}">Delete</button></td></tr>`).join('')}</table></div>`;
 const show=r=>`<span class="tag ${r.kind}">${r.kind}</span> ${esc(thenText(r))} <span class="mut">when ${esc(whenText(r.when||{}))}</span>`;
 $('#rp').onclick=async()=>{try{$('#rm').innerHTML=show(await api('/api/admin/rules',{body:{text:$('#rt').value,preview:true}}))}catch(e){$('#rm').innerHTML=`<span class="err">${esc(e.message)}</span>`}};
 $('#ra').onclick=async()=>{try{await api('/api/admin/rules',{body:{text:$('#rt').value}});rules()}catch(e){$('#rm').innerHTML=`<span class="err">${esc(e.message)}</span>`}};
 document.querySelectorAll('[data-tg]').forEach(c=>c.onchange=()=>api('/api/admin/rules/'+encodeURIComponent(c.dataset.tg),{body:{active:c.checked}}).catch(e=>alert(e.message)));
 document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('Delete this rule?')){await api('/api/admin/rules/'+encodeURIComponent(b.dataset.del),{method:'DELETE'});rules()}})}

/* ---------- 4. sandbox ---------- */
let SB=null,poll=null,play=null;
function sandbox(){$('#main').innerHTML=`<div class="card"><h2>Test what the brain learned</h2><div class="mut">A story goes through the brain, the strict rules, QA and physics, and plays right here. A typed story has no voice (no speech synthesis), so mouths follow the words' syllables.</div><textarea id="st" placeholder="Write a story — or press Test on Random Story">${esc(SB?.story||'')}</textarea><div class="row" style="margin-top:6px"><select id="sf" class="fit"><option>16:9</option><option>9:16</option><option>1:1</option></select><button class="g fit" id="sr">🎲 Test on Random Story</button><button class="fit" id="sc">✍️ Test My Custom Story</button></div><div id="sm" class="mut"></div></div><div id="sv"></div>`;
 const go=async random=>{clearInterval(poll);$('#sm').textContent='Planning…';try{const r=await api('/api/admin/sandbox',{body:random?{random:true,format:$('#sf').value}:{story:$('#st').value,format:$('#sf').value}});SB={id:r.id};watch()}catch(e){$('#sm').innerHTML=`<span class="err">${esc(e.message)}</span>`}};
 $('#sr').onclick=()=>go(true);$('#sc').onclick=()=>go(false);if(SB?.id)watch()}
function watch(){clearInterval(poll);const tick=async()=>{try{const s=await api('/api/admin/sandbox/'+SB.id);const was=SB.stage;SB=s;if($('#st')&&!$('#st').value)$('#st').value=s.story;$('#sm').textContent=s.stage==='ready'?'Ready.':s.stage==='failed'?'':`${s.stage}…`;if(s.stage==='failed'){$('#sm').innerHTML=`<span class="err">${esc(s.error)}</span>`;clearInterval(poll)}if(s.stage==='ready'){clearInterval(poll);if(was!=='ready'||!$('#stage'))showSandbox()}}catch(e){clearInterval(poll);$('#sm').innerHTML=`<span class="err">${esc(e.message)}</span>`}};tick();poll=setInterval(tick,1500)}
function showSandbox(){const s=SB,[w,h]=s.format==='9:16'?[1080,1920]:s.format==='1:1'?[1080,1080]:[1920,1080];
 const rec=s.receipts.map(r=>`<div class="rc ${r.rules.length||r.props.length?'fired':''}"><b>${r.sentence}.</b> ${esc(r.text)}<div class="mut">place <b>${esc(r.place||'—')}</b> · ${r.people.map(p=>esc(`${p.who}: ${p.gesture||p.do}${p.face?' ('+p.face+')':''}`)).join(', ')||'nobody'}${r.brain?' · '+Object.entries(r.brain).map(([k,v])=>esc(k+' '+v)).join(' · '):''}</div>${r.rules.map(x=>`<div class="ok">✅ Applied rule “${esc(x.rule)}”: ${esc(x.did)}</div>`).join('')}${r.props.map(x=>`<div class="ok">✅ ${x.how==='b-roll callout'?'B-roll callout':'Spawned prop'}: ${esc(x.id)} for “${esc(x.word)}” (${esc(x.how)})</div>`).join('')}</div>`).join('');
 const shots=s.shots.map(x=>{const f=s.rulesFired.filter(y=>y.shot===x.shot);return `<div class="rc" data-shot="${x.shot}"><b>Shot ${x.shot}</b> <span class="mut">${x.at.toFixed?x.at.toFixed(1):x.at} s · ${esc(x.place)} · ${esc(x.people.join(', '))}</span><div>${x.headline?`<span class="tag">headline: ${esc(x.headline)}</span>`:''}${x.overlays.map(o=>`<span class="tag">${esc(o)}</span>`).join('')}${x.broll?`<span class="tag">b-roll ${esc(x.broll.template||'recipe')} (${esc(x.broll.mode)})</span>`:''}${x.move?`<span class="tag">camera ${esc(x.move)}</span>`:''}${(x.props||[]).map(p=>`<span class="tag">prop ${esc(p.id)}${p.at!=null?' @'+p.at+' s':''}</span>`).join('')}${x.talkers?.length?`<span class="tag">🗣 ${esc(x.talkers.join(', '))} lip-sync</span>`:''}</div>${f.map(y=>`<div class="ok">✅ Rule “${esc(y.rule)}”: ${esc(y.did)}</div>`).join('')}<div style="margin-top:4px"><button class="g s" data-good="${x.shot}">👍 Good</button> <button class="g s" data-fixit="${x.shot}">👎 Fix This Shot</button></div><div data-fixbox="${x.shot}"></div></div>`}).join('');
 $('#sv').innerHTML=`<div class="sand"><div class="card"><div class="stage" id="stage" style="aspect-ratio:${w}/${h}"><iframe id="pv" src="${s.preview}" width="${w}" height="${h}" title="preview"></iframe></div><div class="player"><button class="s" id="pp">▶ Play</button><input type="range" id="ps" min="0" max="${s.duration}" step="0.01" value="0"><span class="mut" id="pt">0.0 s</span></div>
 <div class="mut" style="margin-top:8px">🗣 Lip-sync: ${s.lipsync.shotsWithASpeaker}/${s.lipsync.shots} shots have a speaker · ${s.lipsync.syllables} syllables synced (${esc(s.lipsync.by)}) · QA repairs ${s.qaRepairs.length} · physics fixes ${s.physicsFixes}</div><h2 style="margin-top:12px">Shots</h2>${shots}</div><div class="card"><h2>Brain decision receipt</h2>${rec}</div></div>`;
 const f=$('#pv'),fit=()=>{const k=$('#stage').clientWidth/w;f.style.transform=`scale(${k})`};fit();addEventListener('resize',fit);
 let t=0,on=false,t0=0;const seek=x=>{const W=f.contentWindow;if(!W?.__timelines?.main)return;t=Math.max(0,Math.min(s.duration,x));W.__timelines.main.seek(t);for(const c of W.document.querySelectorAll('.clip[data-start]')){const a=+c.dataset.start,b=a+(+c.dataset.duration||0);c.style.visibility=t>=a&&t<b?'':'hidden'}$('#ps').value=t;$('#pt').textContent=t.toFixed(1)+' s'};
 f.onload=()=>{const wait=setInterval(()=>{if(f.contentWindow?.__timelines?.main){clearInterval(wait);seek(0)}},100)};
 const loop=()=>{if(!on)return;seek((performance.now()-t0)/1000);if(t>=s.duration){on=false;$('#pp').textContent='▶ Play';return}play=requestAnimationFrame(loop)};
 $('#pp').onclick=()=>{on=!on;$('#pp').textContent=on?'❚❚ Pause':'▶ Play';if(on){if(t>=s.duration)t=0;t0=performance.now()-t*1000;loop()}};$('#ps').oninput=e=>{on=false;$('#pp').textContent='▶ Play';seek(+e.target.value)};
 document.querySelectorAll('[data-good]').forEach(b=>b.onclick=async()=>{try{const r=await api(`/api/admin/sandbox/${s.id}/feedback`,{body:{shot:+b.dataset.good,good:true}});b.textContent='👍 Learned';b.disabled=true}catch(e){alert(e.message)}});
 document.querySelectorAll('[data-fixit]').forEach(b=>b.onclick=()=>{const n=b.dataset.fixit,box=document.querySelector(`[data-fixbox="${n}"]`),sel=(h)=>`<div><label>${h}</label><select data-fx="${h}"><option value="">(keep)</option>${H.heads[h].map(x=>`<option>${esc(x)}</option>`).join('')}</select></div>`;
  box.innerHTML=`<div class="fix">${HEADS.map(sel).join('')}</div><button class="s" style="margin-top:6px" data-save="${n}">Save, teach &amp; re-render</button>`;
  box.querySelector('[data-save]').onclick=async()=>{const fix={};box.querySelectorAll('[data-fx]').forEach(x=>{if(x.value)fix[x.dataset.fx]=x.value});try{await api(`/api/admin/sandbox/${s.id}/feedback`,{body:{shot:+n,good:false,fix}});SB.stage='building';$('#sm').textContent='Re-rendering with your fix…';watch()}catch(e){alert(e.message)}}})}

/* ---------- 5. users, quarantine & vault ---------- */
const hub=(u,b)=>api('/api/hub'+u,b?{body:b}:{});
const svgImg=p=>p?.body?`<img alt="" style="width:64px;height:64px;background:#fff;border-radius:8px;padding:4px" src="data:image/svg+xml;charset=utf-8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${esc(p.viewBox||'0 0 100 100')}">${p.body}</svg>`)}">`:'';
const deltaView=d=>d.type==='rule'?`<b>rule</b> ${esc(d.text)}`:d.type==='feedback'?`<b>shot correction</b> ${esc(d.example?.text)} → ${Object.entries(d.example||{}).filter(([k])=>k!=='text').map(([k,v])=>`<span class="tag">${esc(k)}: ${esc(v)}</span>`).join('')}`:d.type==='word'?`<b>word</b> ${esc(d.concept?.term)} <span class="tag">${esc(d.concept?.category)}</span>`:d.type==='prop'?`<b>prop</b> ${esc(d.prop?.label)} <span class="tag">${esc(d.prop?.source?.license||'?')}</span><div>${svgImg(d.prop)}</div>`:esc(JSON.stringify(d));
async function users(){let st,us,q;try{[st,us,q]=await Promise.all([hub('/status'),hub('/users'),hub('/queue?status=pending')])}catch(e){$('#main').innerHTML=`<div class="card err">${esc(e.message)}</div>`;return}
 $('#main').innerHTML=`<div class="card"><h2>Security vault</h2><div class="row" style="align-items:center"><div class="mut">Global brain <b>v${st.version}</b> · ${st.brain?.examples||0} training examples · vault ${st.vault.exists?`v${st.vault.version}, ${Math.round(st.vault.bytes/1024)} KB, ${esc(st.vault.alg)}, locked ${esc(st.vault.created||'')}`:'not locked yet'} · ${st.queue.pending} waiting</div><button class="fit" id="lock">Lock &amp; Encrypt Brain (AES-256)</button></div><div id="lm" class="mut"></div>
 ${st.eval?`<details style="margin-top:8px"><summary class="mut">Measured accuracy (Top-1 · Top-2) — ${esc(st.eval.run||'')}</summary><table class="tbl"><tr><th>head</th><th>generated</th><th>owner's real-34</th><th>holdout-200</th></tr>${st.eval.rows.map(r=>`<tr><td>${esc(r.head)}</td><td>${esc(r.generated)}</td><td>${esc(r.real)}</td><td>${esc(r.holdout)}</td></tr>`).join('')}</table></details>`:''}</div>
 <div class="card"><h2>Quarantine review queue</h2><div class="mut">Customers' learnings wait here; nothing reaches other users until you approve it.</div>${q.length?q.map(x=>`<div class="rc ${x.score>=0.8?'fired':''}"><div>${deltaView(x.delta)}</div><div class="mut">score ${x.score} · from ${esc(x.from.join(', '))}${x.reasons.length?' · '+esc(x.reasons.join('; ')):''}</div><button class="s" data-hap="${x.id}">Approve &amp; Merge into Encrypted Master Brain</button> <button class="g s" data-hrj="${x.id}">Reject</button></div>`).join(''):'<div class="mut" style="margin-top:6px">Nothing waiting.</div>'}<div id="qm" class="mut"></div></div>
 <div class="card"><h2>Users</h2><div class="row" style="margin:6px 0"><input id="hu" placeholder="user id"><input id="hp" type="password" placeholder="password (8+)"><input id="hd" type="number" min="1" max="10" value="2" title="device limit" class="fit" style="width:80px"><input id="he" type="date" title="expires" class="fit"><button class="fit" id="hadd">Create user</button></div>
 <table class="tbl">${us.map(u=>`<tr><td><b>${esc(u.id)}</b></td><td>${u.status==='active'?'<span class="tag always">Active</span>':'<span class="tag never">Suspended</span>'}</td><td class="mut">${u.devices.length}/${u.deviceLimit} devices${u.devices.length?': '+esc(u.devices.join(', ')):''}${u.expiresAt?' · expires '+esc(u.expiresAt.slice(0,10)):''}</td><td style="text-align:right"><button class="s ${u.status==='active'?'g':''}" data-hks="${esc(u.id)}" data-to="${u.status==='active'?'suspended':'active'}">${u.status==='active'?'Kill-switch: suspend':'Reactivate'}</button></td></tr>`).join('')||'<tr><td class="mut">No users yet.</td></tr>'}</table><div id="um" class="mut"></div></div>`;
 const run=async(fn,el,ok)=>{try{await fn();await users();if(ok&&$(el))$(el).innerHTML=`<span class="ok">${ok}</span>`}catch(e){$(el).innerHTML=`<span class="err">${esc(e.message)}</span>`}};
 $('#lock').onclick=()=>run(()=>hub('/lock',{}),'#lm','Locked and encrypted.');
 document.querySelectorAll('[data-hap]').forEach(b=>b.onclick=()=>run(()=>hub('/approve',{id:b.dataset.hap}),'#qm','Approved: merged into the master brain and re-encrypted.'));
 document.querySelectorAll('[data-hrj]').forEach(b=>b.onclick=()=>run(()=>hub('/reject',{id:b.dataset.hrj}),'#qm','Rejected.'));
 document.querySelectorAll('[data-hks]').forEach(b=>b.onclick=()=>run(()=>hub('/users/'+encodeURIComponent(b.dataset.hks),{status:b.dataset.to}),'#um',b.dataset.to==='suspended'?'Suspended: their sessions stopped now.':'Reactivated.'));
 $('#hadd').onclick=()=>run(()=>hub('/users',{id:$('#hu').value,password:$('#hp').value,deviceLimit:+$('#hd').value,expiresAt:$('#he').value?new Date($('#he').value).toISOString():null}),'#um','User created.')}
draw();
</script>
</body></html>
